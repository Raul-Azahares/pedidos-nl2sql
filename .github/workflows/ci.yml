name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv only publishes exact versions (there is no floating v10 tag)
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies (Python version from .python-version)
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (no API key or network needed)
        run: uv run pytest
